<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Atlehang Semela</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/contactForm.css">
</head>
<body>

  <div class="contact-wrap">

    <!-- Left: message form -->
    <div class="left-panel">
      <h2>Send me a Message</h2>

      <div class="field">
        <input id="nameInput" type="text" placeholder="Name" />
      </div>
      <div class="field">
        <input id="phoneInput" type="text" placeholder="Phone number" />
      </div>
      <div class="field">
        <input id="subjectInput" type="text" placeholder="Subject" />
      </div>
      <div class="field">
        <textarea id="messageInput" placeholder="Message"></textarea>
      </div>

      <button type="button" class="send-btn" id="sendBtn">
        <i class="fa-solid fa-envelope"></i> Send Email
      </button>
    </div>

    <!-- Right: contact details -->
    <div class="right-panel">
      <h3>Contact me</h3>
      <p class="tagline">Open for opportunities, collaborations, or just a chat.</p>

      <div class="contact-row">
        <div class="icon-circle">
          <i class="fa-solid fa-location-dot"></i>
        </div>
        <div class="contact-detail">
          <strong>Address</strong><br>
          <span>Johannesburg, South Africa</span>
        </div>
      </div>

      <div class="contact-row">
        <div class="icon-circle">
          <i class="fa-brands fa-whatsapp"></i>
        </div>
        <div class="contact-detail">
          <strong>WhatsApp</strong><br>
          <a href="https://wa.me/27XXXXXXXXX" target="_blank">+27 66 214 4506</a>
        </div>
      </div>git

      <div class="contact-row">
        <div class="icon-circle">
          <i class="fa-solid fa-envelope"></i>
        </div>
        <div class="contact-detail">
          <strong>Email</strong><br>
          <a href="mailto:atlehangsemela@gmail.com">atlehangsemela@gmail.com</a>
        </div>
      </div>

      <div class="contact-row">
        <div class="icon-circle">
          <i class="fa-brands fa-github"></i>
        </div>
        <div class="contact-detail">
          <strong>GitHub</strong><br>
          <a href="https://github.com/atlehang66" target="_blank">github.com/atlehang66</a>
        </div>
      </div>

    </div>
  </div>

<script>
  (function(){
    function sendMail(){
      const to = 'atlehangsemela@gmail.com';
      const name = document.getElementById('nameInput')?.value.trim() || '';
      const phone = document.getElementById('phoneInput')?.value.trim() || '';
      const subject = document.getElementById('subjectInput')?.value.trim() || 'Contact from website';
      const message = document.getElementById('messageInput')?.value.trim() || '';

      const parts = [];
      if(name) parts.push('Name: ' + name);
      if(phone) parts.push('Phone: ' + phone);
      if(message) parts.push('', message);
      const body = parts.join('\n');

      const mailto = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      window.location.href = mailto;
    }

    const btn = document.getElementById('sendBtn');
    if(btn) btn.addEventListener('click', sendMail);
  })();
</script>
</body>
</html>
